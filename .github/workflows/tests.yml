name: Tests

on:
  - push
  - workflow_dispatch
  - pull_request

jobs:
  build:
    name: Typecheck and build
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (fails on broken links)
        run: npm run build

  cypress:
    name: Cypress smoke tests
    runs-on: 'ubuntu-latest'
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run Cypress smoke tests
        run: npm run test:e2e
